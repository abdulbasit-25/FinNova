<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="FinNova" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="apple-touch-icon" href="/image.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary Meta Tags -->
    <title>FinNova | Personal Finance Tracker</title>
    <meta name="title" content="FinNova | Personal Finance Tracker" />
    <meta
      name="description"
      content="Track spending, manage budgets, and reach savings goals with FinNova, a simple personal finance tracker."
    />
    <meta
      name="keywords"
      content="finance tracker, expense tracker, budgeting app, personal finance, FinNova"
    />
    <meta name="author" content="FinNova" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://finovaa.vercel.app/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://finovaa.vercel.app/" />
    <meta property="og:site_name" content="FinNova" />
    <meta property="og:title" content="FinNova | Personal Finance Tracker" />
    <meta
      property="og:description"
      content="Track spending, manage budgets, and reach savings goals with FinNova, a simple personal finance tracker."
    />
    <meta
      property="og:image"
      content="https://finovaa.vercel.app/og-image.png"
    />
    <meta property="og:image:alt" content="FinNova personal finance tracker logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://finovaa.vercel.app/" />
    <meta name="twitter:title" content="FinNova | Personal Finance Tracker" />
    <meta
      name="twitter:description"
      content="Track spending, manage budgets, and reach savings goals with FinNova, a simple personal finance tracker."
    />
    <meta
      name="twitter:image"
      content="https://finovaa.vercel.app/og-image.png"
    />
    <meta name="twitter:image:alt" content="FinNova personal finance tracker logo" />

    <!-- Search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FinNova",
        "url": "https://finovaa.vercel.app/",
        "description": "A simple personal finance tracker for managing spending, budgets, accounts, and savings goals.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "image": "https://finovaa.vercel.app/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run FinNova.</noscript>

    <!-- Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
